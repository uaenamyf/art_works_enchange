# CreatorHub 宿主机 Nginx 反向代理配置。
# HTTPS 证书由 certbot --nginx 申请并自动写入；此模板先保证 HTTP 代理可用。

upstream creatorhub_web {
    server 127.0.0.1:3000;
}

upstream creatorhub_api {
    server 127.0.0.1:18080;
}

upstream creatorhub_storage {
    server 127.0.0.1:19000;
}

server {
    listen 80;
    listen [::]:80;
    server_name creatormall.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://creatorhub_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.creatormall.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://creatorhub_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name storage.creatormall.shop;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://creatormall.shop" always;
            add_header Access-Control-Allow-Methods "GET, PUT, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Content-Length" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }
        add_header Access-Control-Allow-Origin "https://creatormall.shop" always;
        add_header Access-Control-Expose-Headers "ETag" always;
        proxy_pass http://creatorhub_storage;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        client_max_body_size 100m;
    }
}