services:
  postgres:
    environment:
      POSTGRES_DB: creatorhub_e2e
      POSTGRES_USER: creatorhub_e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?E2E_DB_PASSWORD is required}
    ports:
      - "15433:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data

  redis:
    ports:
      - "6380:6379"
    volumes:
      - redis_e2e_data:/data

  minio:
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_e2e_data:/data

  api:
    environment:
      SPRING_PROFILES_ACTIVE: e2e
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: creatorhub_e2e
      DB_USER: creatorhub_e2e
      DB_PASSWORD: ${E2E_DB_PASSWORD:?E2E_DB_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PAYPAL_CLIENT_ID: ""
      PAYPAL_CLIENT_SECRET: ""
    ports:
      - "8081:8080"

  web:
    build:
      args:
        NEXT_PUBLIC_API_BASE_URL: ${E2E_NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
    ports:
      - "3001:3000"
    environment:
      API_INTERNAL_BASE_URL: http://api:8080

volumes:
  postgres_e2e_data:
  redis_e2e_data:
  minio_e2e_data:
