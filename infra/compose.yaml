services:
  # 默认启动完整本地栈；只想运行中间件时可使用 `docker compose up postgres redis minio`。
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-creatorhub}
      POSTGRES_USER: ${DB_USER:-creatorhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-creatorhub}
    ports:
      # 5432 被宿主机 PostgreSQL 占用；15432 专用于本 Compose 数据库。
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_internal

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_internal

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: creatorhub
      MINIO_ROOT_PASSWORD: creatorhub-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_internal

  api:
    image: ${CREATORHUB_API_IMAGE:-creatorhub-api:local}
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_NAME: ${DB_NAME:-creatorhub}
      DB_USER: ${DB_USER:-creatorhub}
      DB_PASSWORD: ${DB_PASSWORD:-creatorhub}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-change-me-please-32bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-creatorhub-media}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-creatorhub}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-creatorhub-secret}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - creatorhub_internal

  web:
    image: ${CREATORHUB_WEB_IMAGE:-creatorhub-web:local}
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    environment:
      API_INTERNAL_BASE_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    networks:
      - creatorhub_internal

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  creatorhub_internal:
    driver: bridge
