services:
  postgres:
    image: postgres:17-alpine
    container_name: creatorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creatorhub
      POSTGRES_USER: creatorhub
      POSTGRES_PASSWORD: creatorhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorhub -d creatorhub"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_net

  redis:
    image: redis:8-alpine
    container_name: creatorhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_net

  minio:
    image: minio/minio:latest
    container_name: creatorhub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: creatorhub
      MINIO_ROOT_PASSWORD: creatorhub-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_net

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    container_name: creatorhub-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: creatorhub
      DB_USER: creatorhub
      DB_PASSWORD: creatorhub
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-please-change-me-please-32bytes}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - creatorhub_net

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        # Build-time API base URL. The web bundle bakes this in.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8080}
    container_name: creatorhub-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://api:8080}
    ports:
      - "3000:3000"
    networks:
      - creatorhub_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  creatorhub_net:
    driver: bridge
