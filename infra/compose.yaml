services:
  # 本仓库 Compose 现阶段只跑中间件（postgres / redis / minio）。
  # API 与 Web 通过本机进程启动：Web 用 `pnpm dev` / `pnpm start`，
  # API 用 Maven（`mvn spring-boot:run`）。
  # 端口已 publish 到主机，本机 API / Web 用 localhost 直连即可。
  postgres:
    image: postgres:17-alpine
    container_name: creatorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: creatorhub
      POSTGRES_USER: creatorhub
      POSTGRES_PASSWORD: creatorhub
    ports:
      # 5432 被宿主机 PostgreSQL 占用；15432 专用于本 Compose 数据库。
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U creatorhub -d creatorhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: creatorhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: creatorhub-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: creatorhub
      MINIO_ROOT_PASSWORD: creatorhub-secret
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
