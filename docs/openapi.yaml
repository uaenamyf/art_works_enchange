openapi: 3.1.0
info:
  title: CreatorHub API
  version: 1.0.0
  summary: CreatorHub 14 周 MVP 接口契约
  description: |
    CreatorHub 前后端联调的单一事实来源。
    与 docs/plan/development-plan.md 对齐：Week 1 启动后所有 API 变更先修改本文件。
    时间使用 ISO 8601 UTC，金额由 decimal 字符串与 ISO 4217 币种组成。
    所有响应均返回 X-Request-Id；可复用响应在 headers 中显式声明该字段。
    错误使用 RFC 9457 Problem Details；成功响应直接返回资源 DTO，不包装 Result<T>。
  contact:
    name: CreatorHub Engineering
servers:
  - url: http://localhost:8080/api/v1
    description: Local
  - url: https://api.staging.creatorhub.example/api/v1
    description: Staging
tags:
  - name: Health
  - name: Auth
  - name: Creators
  - name: Follows
  - name: Artworks
  - name: Media
  - name: Favorites
  - name: Orders
  - name: Payments
  - name: Webhooks
  - name: Studio
  - name: Notifications
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: 健康检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Auth]
      operationId: register
      summary: 注册用户（Week 3）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          headers:
            Location:
              $ref: '#/components/headers/Location'
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Auth]
      operationId: login
      summary: 邮箱密码登录（Week 3）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/refresh:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: 轮换 Refresh Token（Week 3）
      description: 从 HttpOnly Cookie 读取 Refresh Token 并返回新的 Access Token。
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 刷新成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Auth]
      operationId: logout
      summary: 注销当前会话（Week 3）
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        '204':
          description: 注销成功
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: 获取当前用户概要（Week 3）
      responses:
        '200':
          description: 当前用户
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/creator:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Creators]
      operationId: applyForCreator
      summary: 申请成为 Creator（Week 3）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyCreatorRequest'
      responses:
        '201':
          description: 已创建 Creator
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    put:
      tags: [Creators]
      operationId: updateMyCreatorProfile
      summary: 更新当前 Creator 资料（Week 3）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreatorRequest'
      responses:
        '200':
          description: 更新后的资料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /creators:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Creators]
      operationId: listCreators
      summary: 浏览创作者（Week 5）
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ArtworkCategory'
      responses:
        '200':
          description: 创作者列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPage'
  /creators/{creatorId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Creators]
      operationId: getCreator
      summary: 获取创作者主页（Week 5）
      security: []
      parameters:
        - $ref: '#/components/parameters/CreatorId'
      responses:
        '200':
          description: 创作者主页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /creators/{creatorId}/follow:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    put:
      tags: [Follows]
      operationId: followCreator
      summary: 关注创作者（Week 6）
      parameters:
        - $ref: '#/components/parameters/CreatorId'
      responses:
        '200':
          description: 当前关注状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Follows]
      operationId: unfollowCreator
      summary: 取消关注（Week 6）
      parameters:
        - $ref: '#/components/parameters/CreatorId'
      responses:
        '204':
          description: 已取消关注
        '401':
          $ref: '#/components/responses/Unauthorized'
  /creators/{creatorId}/followers:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Follows]
      operationId: listFollowers
      summary: 创作者粉丝列表（Week 6）
      security: []
      parameters:
        - $ref: '#/components/parameters/CreatorId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 粉丝分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowerPage'
        '404':
          $ref: '#/components/responses/NotFound'
  /me/follows:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Follows]
      operationId: listMyFollows
      summary: 当前用户关注列表（Week 6）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 关注的创作者
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatorPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /artworks:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Artworks]
      operationId: listArtworks
      summary: 浏览与搜索已发布作品（Week 4 / Week 5）
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: query
          in: query
          schema:
            type: string
            maxLength: 100
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/ArtworkCategory'
        - name: creatorId
          in: query
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          schema:
            type: string
            enum: [LATEST, POPULAR, TRENDING]
            default: LATEST
      responses:
        '200':
          description: 作品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkPage'
    post:
      tags: [Studio]
      operationId: createArtworkDraft
      summary: 创建作品草稿（Week 4 / Week 10）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtworkWriteRequest'
      responses:
        '201':
          description: 草稿已创建
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /artworks/{artworkId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Artworks]
      operationId: getArtwork
      summary: 获取作品详情（Week 4 / Week 5）
      security: []
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: 作品详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Studio]
      operationId: updateArtwork
      summary: 更新作品（Week 10）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtworkWriteRequest'
      responses:
        '200':
          description: 更新后的作品
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /artworks/{artworkId}/publish:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Studio]
      operationId: publishArtwork
      summary: 发布作品（Week 4 / Week 10）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /artworks/{artworkId}/submit-review:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Studio]
      operationId: submitArtworkForReview
      summary: 提交作品审核（Week 4）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: 已进入审核队列
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /artworks/{artworkId}/archive:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Studio]
      operationId: archiveArtwork
      summary: 归档作品（Week 10）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: 已归档
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /artworks/{artworkId}/review/approve:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Studio]
      operationId: approveArtworkReview
      summary: 管理员批准作品审核（Week 4）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: 审核通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /artworks/{artworkId}/review/reject:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Studio]
      operationId: rejectArtworkReview
      summary: 管理员拒绝作品审核（Week 4）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequest'
      responses:
        '200':
          description: 审核拒绝
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /media/upload-requests:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Media]
      operationId: createUploadRequest
      summary: 创建预签名上传请求（Week 4）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadRequest'
      responses:
        '201':
          description: 预签名上传信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTarget'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /favorites/{artworkId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    put:
      tags: [Favorites]
      operationId: favoriteArtwork
      summary: 收藏作品（Week 6）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '200':
          description: 当前收藏状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Favorites]
      operationId: unfavoriteArtwork
      summary: 取消收藏（Week 6）
      parameters:
        - $ref: '#/components/parameters/ArtworkId'
      responses:
        '204':
          description: 已取消收藏
        '401':
          $ref: '#/components/responses/Unauthorized'
  /me/favorites:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Favorites]
      operationId: listMyFavorites
      summary: 当前用户收藏列表（Week 6）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 收藏列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Orders]
      operationId: createOrder
      summary: 创建订单并预占库存（Week 7）
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单已创建
          headers:
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Orders]
      operationId: listMyOrders
      summary: 当前用户购买订单列表（Week 11）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: 订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /orders/{orderId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Orders]
      operationId: getOrder
      summary: 获取订单详情（Week 7 / Week 11）
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{orderId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Orders]
      operationId: cancelOrder
      summary: 取消待支付订单（Week 7）
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 已取消
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /orders/{orderId}/payment-intent:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Payments]
      operationId: createPaymentIntent
      summary: 为订单创建或复用 PaymentIntent（Week 8）
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Stripe 客户端确认信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentIntentResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /payments/webhooks/stripe:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Webhooks]
      operationId: handleStripeWebhook
      summary: 接收 Stripe Webhook（Week 8）
      description: 必须使用原始请求体和 Stripe-Signature 验签。
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: 事件已处理或已幂等忽略
        '400':
          $ref: '#/components/responses/BadRequest'
  /studio/dashboard:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Studio]
      operationId: getStudioDashboard
      summary: Studio Dashboard 概览（Week 10）
      responses:
        '200':
          description: 4 项核心指标
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudioDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /studio/artworks:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Studio]
      operationId: listStudioArtworks
      summary: Creator 自己的作品（Week 10）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ArtworkStatus'
      responses:
        '200':
          description: 作品列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtworkPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /studio/orders:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Studio]
      operationId: listStudioOrders
      summary: Creator 自己的销售订单（Week 10）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: 销售订单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /studio/orders/{orderId}/status:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    patch:
      tags: [Studio]
      operationId: updateStudioOrderStatus
      summary: 推进订单履约状态（Week 10）
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderStatusRequest'
      responses:
        '200':
          description: 更新后的订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /notifications:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      tags: [Notifications]
      operationId: listMyNotifications
      summary: 站内通知（Week 9）
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: unreadOnly
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: 通知列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notificationId}/read:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: 标记通知已读（Week 9）
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 已标记
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: 仅由浏览器通过 HttpOnly Cookie 自动发送的轮换 Refresh Token
  headers:
    Location:
      description: 新资源地址
      schema:
        type: string
        format: uri-reference
    RequestId:
      description: 服务端接收或生成的请求追踪 UUID，与 Problem Details 的 requestId 一致
      schema:
        type: string
        format: uuid
    RefreshCookie:
      description: >-
        轮换后的 Refresh Token Cookie。生产环境属性固定为
        HttpOnly; Secure; SameSite=Lax; Path=/api/v1/auth; Max-Age=2592000，且不设置 Domain。
      schema:
        type: string
        example: refresh_token=opaque; Max-Age=2592000; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax
    ClearRefreshCookie:
      description: 使用与设置时相同的属性并通过 Max-Age=0 清除 Refresh Token Cookie
      schema:
        type: string
        example: refresh_token=; Max-Age=0; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端生成的请求追踪 UUID；缺省时由服务端生成，并通过响应头 X-Request-Id 回显
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: 上一页返回的不透明游标
      schema:
        type: string
        maxLength: 500
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    ArtworkId:
      name: artworkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CreatorId:
      name: creatorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID 格式的客户端幂等键；同作用域相同 Key 与相同请求摘要重放首次响应，相同 Key 与不同请求摘要返回 409
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: 请求或字段校验失败
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 未认证或 Token 无效
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 无权操作该资源
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 资源不存在
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 业务状态冲突
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 请求过于频繁
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        version:
          type: string
        timestamp:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          format: password
          minLength: 10
          maxLength: 128
        displayName:
          type: string
          minLength: 2
          maxLength: 50
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    AuthSession:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          description: Access Token 有效秒数
          example: 900
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      required: [id, displayName, role]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        role:
          type: string
          enum: [USER, CREATOR, ADMIN]
    ApplyCreatorRequest:
      type: object
      required: [displayName, slug, category, bio]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        slug:
          type: string
          pattern: '^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])?$'
        category:
          $ref: '#/components/schemas/ArtworkCategory'
        bio:
          type: string
          maxLength: 2000
        location:
          type: [string, 'null']
          maxLength: 100
    UpdateCreatorRequest:
      type: object
      required: [displayName, bio]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 50
        bio:
          type: string
          maxLength: 2000
        location:
          type: [string, 'null']
          maxLength: 100
        socialLinks:
          type: array
          maxItems: 5
          items:
            type: string
            format: uri
    ArtworkCategory:
      type: string
      enum: [ART, PHOTOGRAPHY, CERAMICS, WOODWORK, LEATHER, JEWELRY, FASHION, DIGITAL, COLLECTIBLES]
    ArtworkStatus:
      type: string
      enum: [DRAFT, PENDING_REVIEW, APPROVED, REJECTED, PUBLISHED, SOLD_OUT, ARCHIVED, BLOCKED]
    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PAID, PROCESSING, SHIPPED, COMPLETED, CANCELLED, REFUNDING, REFUNDED]
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          example: '89.00'
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
    Media:
      type: object
      required: [id, url, type, sortOrder]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        altText:
          type: [string, 'null']
          maxLength: 200
        type:
          type: string
          enum: [IMAGE]
        width:
          type: [integer, 'null']
        height:
          type: [integer, 'null']
        sortOrder:
          type: integer
          minimum: 0
    CreatorSummary:
      type: object
      required: [id, slug, displayName, category, verified, followerCount, followedByMe]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: [string, 'null']
          format: uri
        category:
          $ref: '#/components/schemas/ArtworkCategory'
        verified:
          type: boolean
        followerCount:
          type: integer
          minimum: 0
        followedByMe:
          type: boolean
          default: false
    CreatorDetail:
      allOf:
        - $ref: '#/components/schemas/CreatorSummary'
        - type: object
          required: [bio, artworkCount]
          properties:
            bio:
              type: string
              maxLength: 2000
            coverUrl:
              type: [string, 'null']
              format: uri
            location:
              type: [string, 'null']
            artworkCount:
              type: integer
              minimum: 0
            socialLinks:
              type: array
              maxItems: 5
              items:
                type: string
                format: uri
    ArtworkSummary:
      type: object
      required: [id, title, price, status, stock, creator, cover, publishedAt, favoriteCount, favoritedByMe]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        price:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/ArtworkStatus'
        stock:
          type: integer
          minimum: 0
        creator:
          $ref: '#/components/schemas/CreatorSummary'
        cover:
          $ref: '#/components/schemas/Media'
        publishedAt:
          type: string
          format: date-time
        favoriteCount:
          type: integer
          minimum: 0
        favoritedByMe:
          type: boolean
          default: false
    ArtworkDetail:
      allOf:
        - $ref: '#/components/schemas/ArtworkSummary'
        - type: object
          required: [description, category, media, version]
          properties:
            description:
              type: string
              maxLength: 10000
            category:
              $ref: '#/components/schemas/ArtworkCategory'
            media:
              type: array
              minItems: 1
              maxItems: 12
              items:
                $ref: '#/components/schemas/Media'
            editionSize:
              type: [integer, 'null']
              minimum: 1
            productionDays:
              type: [integer, 'null']
              minimum: 0
              maximum: 365
            version:
              type: integer
              minimum: 0
              description: 乐观锁版本
    ArtworkWriteRequest:
      type: object
      required: [title, description, category, price, stock, mediaIds, version]
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 10000
        category:
          $ref: '#/components/schemas/ArtworkCategory'
        price:
          $ref: '#/components/schemas/Money'
        stock:
          type: integer
          minimum: 0
          maximum: 100000
        editionSize:
          type: [integer, 'null']
          minimum: 1
        productionDays:
          type: [integer, 'null']
          minimum: 0
          maximum: 365
        mediaIds:
          type: array
          maxItems: 12
          uniqueItems: true
          items:
            type: string
            format: uuid
        version:
          type: integer
          minimum: 0
    ArtworkPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ArtworkSummary'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    CreatorPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreatorSummary'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    FollowState:
      type: object
      required: [following, followerCount]
      properties:
        following:
          type: boolean
        followerCount:
          type: integer
          minimum: 0
    FollowerPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    FavoriteState:
      type: object
      required: [favorited, favoriteCount]
      properties:
        favorited:
          type: boolean
        favoriteCount:
          type: integer
          minimum: 0
    UploadRequest:
      type: object
      required: [fileName, contentType, sizeBytes, purpose]
      properties:
        fileName:
          type: string
          maxLength: 255
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 15728640
        purpose:
          type: string
          enum: [ARTWORK, AVATAR, CREATOR_COVER]
    UploadTarget:
      type: object
      required: [mediaId, uploadUrl, method, headers, expiresAt]
      properties:
        mediaId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          const: PUT
        headers:
          type: object
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
    ReviewRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    AddressInput:
      type: object
      required: [recipientName, line1, city, postalCode, countryCode, phone]
      properties:
        recipientName:
          type: string
          maxLength: 100
        line1:
          type: string
          maxLength: 200
        line2:
          type: [string, 'null']
          maxLength: 200
        city:
          type: string
          maxLength: 100
        region:
          type: [string, 'null']
          maxLength: 100
        postalCode:
          type: string
          maxLength: 20
        countryCode:
          type: string
          pattern: '^[A-Z]{2}$'
        phone:
          type: string
          minLength: 6
          maxLength: 30
    CreateOrderRequest:
      type: object
      required: [artworkId, quantity, shippingAddress]
      properties:
        artworkId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        shippingAddress:
          $ref: '#/components/schemas/AddressInput'
    OrderItem:
      type: object
      required: [artworkId, title, coverUrl, unitPrice, quantity, subtotal]
      properties:
        artworkId:
          type: string
          format: uuid
        title:
          type: string
        coverUrl:
          type: string
          format: uri
        unitPrice:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
        subtotal:
          $ref: '#/components/schemas/Money'
    OrderDetail:
      type: object
      required: [id, orderNumber, buyerId, seller, status, items, subtotal, shippingFee, total, shippingAddress, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        buyerId:
          type: string
          format: uuid
        seller:
          $ref: '#/components/schemas/CreatorSummary'
        status:
          $ref: '#/components/schemas/OrderStatus'
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItem'
        subtotal:
          $ref: '#/components/schemas/Money'
        shippingFee:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        shippingAddress:
          $ref: '#/components/schemas/AddressInput'
        trackingNumber:
          type: [string, 'null']
        carrier:
          type: [string, 'null']
        expiresAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    OrderPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetail'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
    PaymentIntentResult:
      type: object
      required: [paymentId, provider, clientSecret]
      properties:
        paymentId:
          type: string
          format: uuid
        provider:
          type: string
          const: STRIPE
        clientSecret:
          type: string
    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PROCESSING, SHIPPED]
        trackingNumber:
          type: [string, 'null']
          maxLength: 100
        carrier:
          type: [string, 'null']
          maxLength: 100
    StudioDashboard:
      type: object
      required: [revenue, orderCount, publishedArtworkCount, followerCount]
      properties:
        revenue:
          $ref: '#/components/schemas/Money'
        orderCount:
          type: integer
          minimum: 0
        publishedArtworkCount:
          type: integer
          minimum: 0
        followerCount:
          type: integer
          minimum: 0
    Notification:
      type: object
      required: [id, type, title, body, readAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [ARTWORK_PUBLISHED, ORDER_STATUS_CHANGED, PAYMENT_SUCCEEDED, PAYMENT_FAILED]
        title:
          type: string
        body:
          type: string
        readAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          type: string
          format: date-time
        link:
          type: [string, 'null']
          format: uri-reference
    NotificationPage:
      type: object
      required: [items, hasMore, unreadCount]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        nextCursor:
          type: [string, 'null']
        hasMore:
          type: boolean
        unreadCount:
          type: integer
          minimum: 0
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: [string, 'null']
        instance:
          type: [string, 'null']
          format: uri-reference
        code:
          type: string
          description: 稳定的机器可读业务错误码
          example: ARTWORK_OUT_OF_STOCK
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
