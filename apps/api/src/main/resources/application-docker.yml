spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:creatorhub}
    username: ${DB_USER:creatorhub}
    password: ${DB_PASSWORD:creatorhub}
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true

logging:
  level:
    com.creatorhub: INFO
