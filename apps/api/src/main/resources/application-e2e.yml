# E2E 配置只能通过显式 SPRING_PROFILES_ACTIVE=e2e 启用，避免影响本地默认和生产限流。
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:15432}/${DB_NAME:creatorhub}
    username: ${DB_USER:creatorhub}
    password: ${DB_PASSWORD:creatorhub}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

creatorhub:
  rate-limit:
    registration:
      ip:
        limit: 1000
        window-seconds: 60
    login:
      ip:
        limit: 1000
        window-seconds: 60
      email:
        limit: 1000
        window-seconds: 60
    refresh:
      ip:
        limit: 1000
        window-seconds: 60