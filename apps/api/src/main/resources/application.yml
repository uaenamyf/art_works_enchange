spring:
  application:
    name: creatorhub-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  flyway:
    enabled: true
    baseline-on-migrate: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-handlers-package: com.creatorhub.config
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: input

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

creatorhub:
  catalog:
    # true：提交作品后进入 Admin 审核；false：满足发布门禁后直接上架。
    artwork-review-enabled: ${ARTWORK_REVIEW_ENABLED:true}
  security:
    jwt:
      # 占位：通过 ENV 注入；至少 32 字节
      secret: ${JWT_SECRET:change-me-please-change-me-please-32bytes}
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 1209600
      issuer: creatorhub
  cookie:
    refresh:
      name: ch_refresh
      path: /api/v1/auth
      same-site: lax
      secure: false
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    registration:
      ip:
        limit: 3
        window-seconds: 3600
    login:
      ip:
        limit: 5
        window-seconds: 60
      email:
        limit: 10
        window-seconds: 3600
    refresh:
      ip:
        limit: 30
        window-seconds: 60
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:creatorhub-media}
    access-key: ${S3_ACCESS_KEY:creatorhub}
    secret-key: ${S3_SECRET_KEY:creatorhub-secret}
    upload-url-ttl-seconds: 900
  payment:
    paypal:
      base-url: ${PAYPAL_BASE_URL:https://api-m.sandbox.paypal.com}
      client-id: ${PAYPAL_CLIENT_ID:}
      client-secret: ${PAYPAL_CLIENT_SECRET:}
      partner-attribution-id: ${PAYPAL_PARTNER_ATTRIBUTION_ID:}
      webhook-id: ${PAYPAL_WEBHOOK_ID:}
